# DRAFT, not applied. bioeconomia.apambiente.pt on the APA VPS (Ploi server
# 125218): terminates TLS with APA's HARICA certificate and proxies every
# request to the Frontend Worker at https://nomia.bnq.pt. See
# docs/plans/apa-harica-proxy-and-cms-move.md.
#
# Install: create a Ploi site for bioeconomia.apambiente.pt on server 125218,
# replace its NGINX configuration with this file (Ploi → Site → Manage → NGINX
# configuration), and copy bioeconomia-proxy.conf to
# /etc/nginx/snippets/bioeconomia-proxy.conf. `nginx -t` before every reload.
#
# The directives above the server blocks live at http{} level: Ploi includes
# site configurations inside http{}, so they are valid here.

# The public origin, as the Worker knows it. A browser on
# bioeconomia.apambiente.pt sends Origin: https://bioeconomia.apambiente.pt;
# the Worker only sees Host nomia.bnq.pt, so @getquick/content's same-origin
# guard (forms, consent) and Astro's checkOrigin would refuse the post. Every
# other Origin, and none, is passed on unchanged.
map $http_origin $bioeconomia_upstream_origin {
    default                             $http_origin;
    "https://bioeconomia.apambiente.pt" "https://nomia.bnq.pt";
}

# Visitors' posts, limited here per visitor: behind this proxy the Worker's
# own rate limiters (FORMS_RATE_LIMITER, CONSENT_RATE_LIMITER) key on
# CF-Connecting-IP, which is this server's address for everyone.
limit_req_zone $binary_remote_addr zone=bioeconomia_posts:10m rate=30r/m;
limit_req_status 429;

# Astro's hashed build assets only (/_astro/*: immutable). HTML is never cached
# here: the Worker serves it fresh from its publication store.
proxy_cache_path /var/cache/nginx/bioeconomia levels=1:2
    keys_zone=bioeconomia_static:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name bioeconomia.apambiente.pt;

    # HTTP-01 for the HARICA certificate (deploy/apa-proxy/harica).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/harica-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://bioeconomia.apambiente.pt$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1; on an older nginx use `listen 443 ssl http2;` instead.
    http2 on;
    server_name bioeconomia.apambiente.pt;

    # Written by certbot (deploy/apa-proxy/harica/issue-certbot.sh), or by hand
    # for a certificate APA issues from our CSR (harica/install-manual-cert.sh);
    # both use these paths.
    ssl_certificate /etc/harica/live/bioeconomia.apambiente.pt/fullchain.pem;
    ssl_certificate_key /etc/harica/live/bioeconomia.apambiente.pt/privkey.pem;
    ssl_trusted_certificate /etc/harica/live/bioeconomia.apambiente.pt/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bioeconomia_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HARICA still runs OCSP responders.
    ssl_stapling on;
    ssl_stapling_verify on;

    # Re-resolves nomia.bnq.pt (Cloudflare anycast) instead of pinning the
    # addresses nginx saw at start-up; proxy_pass uses $frontend below.
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Only once APA agrees: HSTS on their hostname is theirs to commit to. No
    # includeSubDomains (it would cover nothing here, but don't imply it).
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    access_log /var/log/nginx/bioeconomia.apambiente.pt-access.log;
    error_log /var/log/nginx/bioeconomia.apambiente.pt-error.log warn;

    set $frontend https://nomia.bnq.pt;

    location / {
        include /etc/nginx/snippets/bioeconomia-proxy.conf;
        proxy_pass $frontend;
    }

    # Form submissions and consent decisions (POST), limited per visitor.
    location ^~ /gq/forms/ {
        include /etc/nginx/snippets/bioeconomia-proxy.conf;
        limit_req zone=bioeconomia_posts burst=10 nodelay;
        proxy_pass $frontend;
    }

    location = /gq/consent {
        include /etc/nginx/snippets/bioeconomia-proxy.conf;
        limit_req zone=bioeconomia_posts burst=10 nodelay;
        proxy_pass $frontend;
    }

    # The map proxy (apps/frontend/src/lib/map-tiles.ts) writes the request's
    # own origin (https://nomia.bnq.pt) into its style and TileJSON, so the
    # browser would fetch tiles cross-origin, without CORS. Stopgap until the
    # Site writes its public origin there instead: rewrite it on the way out.
    location ^~ /gq/map/ {
        include /etc/nginx/snippets/bioeconomia-proxy.conf;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter "https://nomia.bnq.pt" "https://bioeconomia.apambiente.pt";
        sub_filter_once off;
        proxy_pass $frontend;
    }

    location ^~ /_astro/ {
        include /etc/nginx/snippets/bioeconomia-proxy.conf;
        proxy_cache bioeconomia_static;
        proxy_cache_key "nomia.bnq.pt$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Proxy-Cache $upstream_cache_status always;
        proxy_pass $frontend;
    }
}
