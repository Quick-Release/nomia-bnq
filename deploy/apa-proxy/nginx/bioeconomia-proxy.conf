# /etc/nginx/snippets/bioeconomia-proxy.conf, included in
# every location of bioeconomia.apambiente.pt.conf. One snippet because a
# location that sets any proxy_set_header inherits none from its server.

proxy_http_version 1.1;
proxy_set_header Connection "";

# TLS to Cloudflare: SNI and Host are the Worker's Custom Domain, and its
# certificate is verified like a browser would.
proxy_ssl_server_name on;
proxy_ssl_name nomia.bnq.pt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse on;
proxy_set_header Host nomia.bnq.pt;

# What the visitor asked for. This is the first hop, so the client's own
# X-Forwarded-* and X-Real-IP are replaced, never appended to. Cloudflare sets
# CF-Connecting-IP to this server's address whatever is sent; the Worker can
# only learn the visitor's address from X-Real-IP, and only once it trusts
# this server (open question in the plan).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header Origin $bioeconomia_upstream_origin;

# The Worker renders on demand; Cloudflare caps a response long before 60s.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;
# GET/HEAD only (nginx never retries a POST unless told to).
proxy_next_upstream error timeout http_502 http_504;
proxy_next_upstream_tries 2;

proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 16k;

# HSTS for bioeconomia.apambiente.pt only, on every HTTPS response (errors
# included). Its max-age is $bioeconomia_hsts_max_age, set at the top of
# bioeconomia.apambiente.pt.conf. Any HSTS from upstream (the bnq.pt zone or
# the Worker) is dropped, so APA's visitors only ever get this one.
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=$bioeconomia_hsts_max_age" always;

# The other security headers, on every HTTPS response and also only here, for
# the same reason: nothing upstream sends them today, and if the Worker ever
# does, the proxy's copy is the one APA's visitors get.
#
# Content-Security-Policy, one source list per kind of resource. Checked on
# 2026-10-30 against the 80 pages linked from the homepage, with consent given
# so that the embeds loaded:
#   script-src, style-src  'unsafe-inline': Astro inlines its module scripts and
#                          the consent configuration, and the CMS's blocks
#                          render style attributes and <style> elements.
#   img-src, media-src     uploads on nomia-media.bnq.pt; data: and blob: for
#                          inline SVG and the map.
#   connect-src 'self'     forms, consent, search and the map, whose tiles the
#                          Worker proxies (/gq/map/).
#   worker-src blob:       MapLibre starts its workers from a blob URL.
#   frame-src              the embeds gq-content's consent knows: YouTube,
#                          Vimeo and Google Maps.
# Google Analytics is off (no measurementId). Turning it on also needs
# https://www.googletagmanager.com in script-src and the Google Analytics hosts
# in connect-src and img-src. Any new third party needs adding here as well.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://nomia-media.bnq.pt; media-src 'self' blob: https://nomia-media.bnq.pt; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
# frame-ancestors above replaces this in current browsers; older ones read it.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# YouTube refuses to play an embed whose request carries no referrer, so the
# origin is still sent cross-origin (over HTTPS).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Powerful features the site doesn't use. Autoplay, fullscreen, encrypted-media
# and picture-in-picture are left alone: the video embeds delegate them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), browsing-topics=()" always;

# Absolute redirects and cookies the Worker scopes to its own host.
proxy_redirect https://nomia.bnq.pt/ https://bioeconomia.apambiente.pt/;
proxy_cookie_domain nomia.bnq.pt bioeconomia.apambiente.pt;
