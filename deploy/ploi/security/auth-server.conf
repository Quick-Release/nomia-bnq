# Site-specific server-scope directives and login handler.
# Mirror of the live Ploi vhost; not automatically deployed.
    # Nomia authentication visibility; dry-run until normal traffic is reviewed.
    # Inherits only the globally trusted Cloudflare proxy networks.
    real_ip_header CF-Connecting-IP;

    location = /wp/wp-login.php {
        access_log /var/log/nginx/nomia-auth/access.log nomia_auth;
        limit_req zone=nomia_login_post burst=5 nodelay;
        limit_req_dry_run on;
        limit_req_status 429;
        # Avoid limiter error messages logging raw query strings.
        # Dry-run decisions are recorded in the sanitized access log instead.
        limit_req_log_level notice;
        # Do not internally redirect missing scripts into WordPress.
        error_page 404 = @nomia_php_not_found;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.4-fpm-nomiabnq.sock;
        fastcgi_buffers 32 32k;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }
