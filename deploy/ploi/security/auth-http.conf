# Site-specific http-scope include: before/nomia-auth-http.conf.
# Empty keys are not rate limited; only the actual login POST is counted.
map "$request_method:$uri" $nomia_login_post_key {
    default "";
    "POST:/wp/wp-login.php" $binary_remote_addr;
}

limit_req_zone $nomia_login_post_key zone=nomia_login_post:1m rate=6r/m;

# Intentionally no request/query, headers, usernames, cookies or body.
log_format nomia_auth escape=json
    '{"time":"$time_iso8601","client":"$remote_addr",'
    '"peer":"$realip_remote_addr","method":"$request_method",'
    '"endpoint":"/wp/wp-login.php","status":$status,'
    '"limiter":"$limit_req_status","seconds":$request_time}';
