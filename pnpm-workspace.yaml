packages:
  - "apps/*"
  - "infra"
  - "infra/ci"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  workerd: true
  # sass (through vite-plus) doesn't need its prebuilt watcher binary.
  "@parcel/watcher": false
# GETQUICK's own tooling may be installed the day it is released.
minimumReleaseAgeExclude:
  - "@getquick/site"
  - "@getquick/content"
overrides:
  "@effect/platform-node-shared": 4.0.7
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
catalog:
  # Alchemy/Effect: shared by infra (deploy) and apps/frontend (the Astro build
  # resolves the Alchemy server entrypoint from apps/frontend).
  "@alchemy.run/cloudflare": 2.0.0-beta.84
  "@alchemy.run/frontend-frameworks": 2.0.0-beta.84
  "@effect/platform-node": 4.0.7
  alchemy: 2.0.0-beta.84
  effect: 4.0.7
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
  vite-plus: 0.3.0
peerDependencyRules:
  allowedVersions:
    effect: 4.0.7
    vite: 0.3.0
